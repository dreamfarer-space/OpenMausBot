name: Patch PR 1719 locale review

on:
  push:
    branches:
      - feat/chinese-localization-upstream

permissions:
  contents: write

jobs:
  patch-locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chinese-localization-upstream
          fetch-depth: 0
      - name: Patch reviewed onboarding copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          replacements = {
              "src/locales/zh.json": {
                  "onboarding.tour.apps-panel": "应用程序市集。登录一次即可连接应用程序；每个机器人都有自己的「设置 → 访问权 → 已连接的应用程序」访问权设置。我们会关掉这个，继续往下。",
                  "onboarding.spot.connector": "当机器人需要你尚未连接的应用程序时，会在这里询问。在浏览器登录一次即可连接应用程序；每个机器人都可以单独启用「已连接的应用程序」访问权。",
                  "onboarding.reel.apps.body": "Gmail、Slack、GitHub、Notion，还有数百个其他服务。登录一次即可连接这些应用程序；每个机器人都有自己的「已连接的应用程序」访问权设置。如果机器人需要你尚未连接的服务，会直接在对话中询问。",
              },
              "src/locales/zh-tw.json": {
                  "onboarding.tour.apps-panel": "應用程式市集。登入一次即可連接應用程式；每個機器人都有自己的「設定 → 存取權 → 已連接的應用程式」存取權設定。我們會關掉這個，繼續往下。",
                  "onboarding.spot.connector": "當機器人需要你尚未連接的應用程式時，會在這裡詢問。在瀏覽器登入一次即可連接應用程式；每個機器人都可以單獨啟用「已連接的應用程式」存取權。",
                  "onboarding.reel.apps.body": "Gmail、Slack、GitHub、Notion，還有數百個其他服務。登入一次即可連接這些應用程式；每個機器人都有自己的「已連接的應用程式」存取權設定。如果機器人需要你尚未連接的服務，會直接在對話中詢問。",
              },
          }
          for path, values in replacements.items():
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              for key, value in values.items():
                  pattern = re.compile(r'^(\s*"' + re.escape(key) + r'"\s*:\s*).*?(,?)$', re.MULTILINE)
                  text, count = pattern.subn(lambda m, v=value: m.group(1) + json.dumps(v, ensure_ascii=False) + m.group(2), text, count=1)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one {key}, found {count}")
              p.write_text(text, encoding="utf-8")
          PY
          python3 -m json.tool src/locales/zh.json >/dev/null
          python3 -m json.tool src/locales/zh-tw.json >/dev/null
          git diff --check
          rm .github/workflows/patch-pr1719-locale.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/locales/zh.json src/locales/zh-tw.json .github/workflows/patch-pr1719-locale.yml
          git commit -m "fix(i18n): clarify per-bot connected app access"
          git push origin HEAD:feat/chinese-localization-upstream
